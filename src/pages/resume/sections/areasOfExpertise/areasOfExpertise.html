<section class="section">
  <h3>Areas of Expertise</h3>
  <!--
    The order of `areasOfExpertise` in resume.json is deliberate, so `repeat.for` renders it
    as-is and the two columns fill top to bottom: the first half down the left, the rest
    down the right.
  -->
  <div class="content areas-of-expertise">
    <div repeat.for="area of areasOfExpertise" class="area-of-expertise">${area}</div>
  </div>
</section>
